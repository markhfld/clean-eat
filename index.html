<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#f4f6f9" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Clean Eat" />
  <link rel="apple-touch-icon" href="./icons/icon.svg" />
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="stylesheet" href="./css/styles.css" />
  <title>Clean Eat</title>
</head>
<body>
  <header id="topbar">
    <div class="brand">🥗 Clean&nbsp;Eat</div>
    <button id="modeToggle" class="mode-chip" title="Toggle flare / remission mode"></button>
  </header>

  <main id="app"><!-- views render here --></main>

  <nav id="tabbar">
    <button class="tab" data-tab="plan">🍽️<span>Plan</span></button>
    <button class="tab" data-tab="check">🔍<span>Check</span></button>
    <button class="tab" data-tab="stack">💊<span>Stack</span></button>
    <button class="tab" data-tab="foods">🛒<span>Foods</span></button>
    <button class="tab" data-tab="profile">⚙️<span>Profile</span></button>
  </nav>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
